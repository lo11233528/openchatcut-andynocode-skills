name: Temporary Bilibili Retrieval

on:
  push:
    branches:
      - "chatgpt/bilibili-BV1mZ8X6uEqD"

permissions:
  contents: read

jobs:
  retrieve-and-transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch verified metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          BV="BV1mZ8X6uEqD"

          curl -fL --retry 3 --connect-timeout 20 -A "Discordbot/2.0" \
            "https://fxbilibili.seria.moe/video/${BV}" -o results/fxbilibili-embed.html
          curl -fL --retry 3 --connect-timeout 20 -A "Discordbot/2.0" \
            "https://www.vxbilibili.com/video/${BV}" -o results/bilifix-embed.html
          curl -fL --retry 3 --connect-timeout 20 \
            "https://www.vxbilibili.com/oembed/video?id=${BV}&lang=zh-cn" -o results/bilifix-oembed.json

          python - <<'PY'
          import html
          import json
          import re
          from pathlib import Path

          root = Path("results")

          def read_meta(path: Path) -> dict:
              source = path.read_text(encoding="utf-8", errors="replace")
              found = {}
              for prop in ("og:title", "og:description", "og:image", "og:video", "og:video:url"):
                  expressions = (
                      rf'<meta[^>]+property=["\']{re.escape(prop)}["\'][^>]+content=["\']([^"\']*)',
                      rf'<meta[^>]+content=["\']([^"\']*)["\'][^>]+property=["\']{re.escape(prop)}["\']',
                  )
                  for expression in expressions:
                      match = re.search(expression, source, re.I)
                      if match:
                          found[prop] = html.unescape(match.group(1))
                          break
              return found

          payload = {
              "bvid": "BV1mZ8X6uEqD",
              "fxbilibili": read_meta(root / "fxbilibili-embed.html"),
              "bilifix": read_meta(root / "bilifix-embed.html"),
              "oembed": json.loads((root / "bilifix-oembed.json").read_text(encoding="utf-8")),
          }
          (root / "metadata-summary.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Download the low-resolution analysis copy
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 \
            "https://fxbilibili.seria.moe/dl/BV1mZ8X6uEqD" -o results/video.mp4
          test -s results/video.mp4
          ffprobe -v error -show_entries format=duration,size,format_name \
            -show_entries stream=index,codec_name,codec_type,width,height \
            -of json results/video.mp4 > results/media-info.json
          ffmpeg -hide_banner -loglevel error -y -i results/video.mp4 -vn -ac 1 -ar 16000 \
            -c:a libmp3lame -b:a 48k results/audio.mp3
          test -s results/audio.mp3

      - name: Install speech recognizer
        shell: bash
        run: python -m pip install --disable-pip-version-check -q faster-whisper

      - name: Transcribe the Chinese audio
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from faster_whisper import WhisperModel

          root = Path("results")
          model = WhisperModel("small", device="cpu", compute_type="int8")
          generated, info = model.transcribe(
              str(root / "audio.mp3"),
              language="zh",
              beam_size=5,
              best_of=5,
              vad_filter=True,
              vad_parameters={"min_silence_duration_ms": 500},
              condition_on_previous_text=True,
          )

          items = []
          rendered = []
          for segment in generated:
              text = segment.text.strip()
              if not text:
                  continue
              item = {"start": segment.start, "end": segment.end, "text": text}
              items.append(item)
              hours = int(segment.start // 3600)
              minutes = int((segment.start % 3600) // 60)
              seconds = int(segment.start % 60)
              rendered.append(f"[{hours:02d}:{minutes:02d}:{seconds:02d}] {text}")

          if not items:
              raise RuntimeError("Speech recognition returned no segments")

          (root / "transcript.txt").write_text("\n".join(rendered), encoding="utf-8")
          (root / "transcript-segments.json").write_text(
              json.dumps(
                  {
                      "language": info.language,
                      "language_probability": info.language_probability,
                      "duration": info.duration,
                      "segments": items,
                  },
                  ensure_ascii=False,
                  indent=2,
              ),
              encoding="utf-8",
          )
          (root / "status.json").write_text(
              json.dumps(
                  {
                      "transcript_available": True,
                      "transcript_source": "faster-whisper-small",
                      "segment_count": len(items),
                      "character_count": len("".join(rendered)),
                  },
                  indent=2,
              ),
              encoding="utf-8",
          )
          print(f"Transcribed {len(items)} segments across {info.duration:.1f} seconds")
          PY

      - name: Remove source audiovisual files
        if: always()
        shell: bash
        run: rm -f results/video.mp4 results/audio.mp3

      - name: Upload retrieval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-BV1mZ8X6uEqD-results
          path: results/
          if-no-files-found: error
          retention-days: 1
