name: Temporary Bilibili Fast Transcription

on:
  push:
    branches:
      - "chatgpt/bilibili-BV1mZ8X6uEqD"

permissions:
  contents: read

jobs:
  fast-transcription:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        env:
          HF_HUB_DISABLE_XET: "1"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -q requests faster-whisper

      - name: Retrieve signed Bilibili audio
        run: |
          set -euo pipefail
          mkdir -p results
          python - <<'PY'
          import hashlib, json, time, urllib.parse
          from pathlib import Path
          import requests

          BV = "BV1mZ8X6uEqD"
          MIX = (
              46,47,18,2,53,8,23,32,15,50,10,31,58,3,45,35,
              27,43,5,49,33,9,42,19,29,28,14,39,12,38,41,13,
              37,48,7,16,24,55,40,61,26,17,0,1,60,51,30,4,
              22,25,54,21,56,59,6,63,57,62,11,36,20,34,44,52,
          )
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0 Safari/537.36",
              "Referer": "https://www.bilibili.com/",
              "Origin": "https://www.bilibili.com",
          }
          s = requests.Session()
          s.headers.update(headers)

          def get_json(url, params=None):
              r = s.get(url, params=params, timeout=(20, 60))
              r.raise_for_status()
              return r.json()

          nav = get_json("https://api.bilibili.com/x/web-interface/nav")
          wbi = nav["data"]["wbi_img"]
          img = wbi["img_url"].rsplit("/", 1)[-1].split(".", 1)[0]
          sub = wbi["sub_url"].rsplit("/", 1)[-1].split(".", 1)[0]
          raw = img + sub
          key = "".join(raw[i] for i in MIX)[:32]

          def sign(params):
              out = {}
              for k, v in params.items():
                  value = str(v)
                  for char in "!'()*":
                      value = value.replace(char, "")
                  out[k] = value
              out["wts"] = str(int(time.time()))
              query = urllib.parse.urlencode(sorted(out.items()))
              out["w_rid"] = hashlib.md5((query + key).encode()).hexdigest()
              return out

          view = get_json(
              "https://api.bilibili.com/x/web-interface/wbi/view",
              sign({"bvid": BV}),
          )
          data = view["data"]
          cid = data["cid"]
          play = get_json(
              "https://api.bilibili.com/x/player/wbi/playurl",
              sign({"bvid": BV, "cid": cid, "qn": 16, "fnval": 4048, "fnver": 0, "fourk": 0}),
          )
          tracks = play["data"]["dash"]["audio"]
          track = min(tracks, key=lambda x: int(x.get("bandwidth") or 10**12))
          urls = [track.get("baseUrl") or track.get("base_url")]
          urls += track.get("backupUrl") or track.get("backup_url") or []

          target = Path("results/audio-source.m4s")
          errors = []
          for url in [u for u in urls if u]:
              try:
                  with s.get(url, stream=True, timeout=(25, 90)) as r:
                      r.raise_for_status()
                      with target.open("wb") as f:
                          for chunk in r.iter_content(1024 * 1024):
                              if chunk:
                                  f.write(chunk)
                  if target.stat().st_size > 100000:
                      break
              except Exception as exc:
                  errors.append(repr(exc))
                  target.unlink(missing_ok=True)
          if not target.exists():
              raise RuntimeError(errors)

          metadata = {
              "bvid": BV,
              "title": data.get("title"),
              "duration_seconds": data.get("duration"),
              "published_unix": data.get("pubdate"),
              "owner": data.get("owner"),
              "staff": [
                  {
                      "name": member.get("name"),
                      "role": member.get("title"),
                      "official": (member.get("official") or {}).get("title"),
                  }
                  for member in data.get("staff") or []
              ],
              "stats": data.get("stat"),
              "downloaded_audio_bytes": target.stat().st_size,
          }
          Path("results/metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(json.dumps(metadata, ensure_ascii=False, indent=2))
          PY

          ffmpeg -hide_banner -loglevel error -y -i results/audio-source.m4s \
            -vn -ac 1 -ar 16000 -c:a libmp3lame -b:a 48k results/audio.mp3

      - name: Run fast transcript pass
        env:
          HF_HUB_DISABLE_XET: "1"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from faster_whisper import WhisperModel

          root = Path("results")
          model = WhisperModel(
              "base",
              device="cpu",
              compute_type="int8",
              cpu_threads=max(2, min(8, os.cpu_count() or 4)),
              num_workers=2,
          )
          stream, info = model.transcribe(
              str(root / "audio.mp3"),
              beam_size=1,
              best_of=1,
              vad_filter=True,
              vad_parameters={"min_silence_duration_ms": 400},
              condition_on_previous_text=True,
              initial_prompt="投资人 Lars Tvede 接受本子在隔壁采访，讨论财富、投资、创业、科技与人生选择。",
          )
          segments, lines = [], []
          for seg in stream:
              text = seg.text.strip()
              if not text:
                  continue
              segments.append({"start": seg.start, "end": seg.end, "text": text})
              h = int(seg.start // 3600)
              m = int((seg.start % 3600) // 60)
              sec = int(seg.start % 60)
              lines.append(f"[{h:02d}:{m:02d}:{sec:02d}] {text}")
          if not segments:
              raise RuntimeError("No transcript generated")
          (root / "transcript.txt").write_text("\n".join(lines), encoding="utf-8")
          (root / "transcript-segments.json").write_text(
              json.dumps({
                  "model": "faster-whisper-base",
                  "language": info.language,
                  "language_probability": info.language_probability,
                  "duration_seconds": info.duration,
                  "segments": segments,
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          (root / "status.json").write_text(
              json.dumps({
                  "model": "faster-whisper-base",
                  "segment_count": len(segments),
                  "transcript_characters": len("".join(lines)),
                  "duration_seconds": info.duration,
              }, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Generated {len(segments)} transcript segments")
          PY

      - name: Remove media files
        if: always()
        run: rm -f results/audio-source.m4s results/audio.mp3

      - name: Upload transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-BV1mZ8X6uEqD-fast-results
          path: results/
          if-no-files-found: error
          retention-days: 1
